<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR ááÃØÝÇá</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }

    /* ===== ÔÇÔÉ ÇáãÓÍ (ÓßÇäÑ) ===== */
    #scanner {
      position: fixed; top: 50%; left: 50%;
      width: 68vmin; height: 68vmin;
      transform: translate(-50%, -50%);
      z-index: 1; pointer-events: none;
      box-shadow: 0 0 0 100vmax rgba(0,0,0,0.5);
      border-radius: 18px;
      border: 4px solid #00e676;
    }
    #scanner b {
      position: absolute; left: 6%; width: 88%; height: 4px;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, #00e676, transparent);
      box-shadow: 0 0 14px 4px rgba(0,230,118,0.7);
      animation: scan 2s ease-in-out infinite alternate;
    }
    @keyframes scan { from { top: 6%; } to { top: 94%; } }

    /* ===== ÇáÃÒÑÇÑ ===== */
    .btn-bar {
      position: fixed; bottom: 25px; left: 0; width: 100%;
      display: flex; justify-content: center; gap: 24px;
      z-index: 10; pointer-events: none;
      visibility: hidden; opacity: 0;
      transform: translateY(60px);
      transition: opacity 0.4s, transform 0.5s, visibility 0s 0.5s;
    }
    .btn-bar.show {
      visibility: visible; opacity: 1; transform: none;
      transition: opacity 0.4s, transform 0.5s;
    }
    .kid-btn {
      pointer-events: auto;
      width: 110px; height: 110px;
      border: 5px solid #fff; border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #btn1 { background: #ff4d8d; box-shadow: 0 8px 0 #c2185b, 0 12px 18px rgba(0,0,0,0.35); }
    #btn2 { background: #29b6f6; box-shadow: 0 8px 0 #0277bd, 0 12px 18px rgba(0,0,0,0.35); }
    #btn1:active { transform: translateY(6px) scale(0.95); box-shadow: 0 2px 0 #c2185b; }
    #btn2:active { transform: translateY(6px) scale(0.95); box-shadow: 0 2px 0 #0277bd; }
  </style>
<base target="_blank">
</head>

<body>
  <!-- ===== ãáÝÇÊ ÇáÕæÊ (ßáåÇ Ýí ãÌáÏ assets) ===== -->
  <audio id="sound1" src="./assets/sound1.mp3" preload="auto"></audio>
  <audio id="sound2" src="./assets/sound2.mp3" preload="auto"></audio>
  <audio id="bgm" src="./assets/bgm.mp3" preload="auto" loop></audio>

  <div id="scanner"><b></b></div>

  <!-- ===== ÇáÒÑÇÑíä (ÈíÙåÑæÇ áãÇ ÇáÊÇÑÌíÊ íÊÚÑÝ) ===== -->
  <div class="btn-bar" id="btnBar">
    <button id="btn1" class="kid-btn" aria-label="ÇáÕæÊ ÇáÃæá"></button>
    <button id="btn2" class="kid-btn" aria-label="ÇáÕæÊ ÇáËÇäí"></button>
  </div>

  <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind; uiScanning: no;"
           color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- ===== ÇáãæÏíá ÝÞØ — ãÝíÔ ÕæÑ ===== -->
      <a-gltf-model id="avatar" rotation="0 0 0" position="0 0 0.1" scale="3 3 3"
        src="./assets/model.glb"
        animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const target  = document.getElementById("target");
    const scanner = document.getElementById("scanner");
    const btnBar  = document.getElementById("btnBar");
    const bgm     = document.getElementById("bgm");
    bgm.volume = 0.5;

    const buttons = [
      { btn: document.getElementById("btn1"), sound: document.getElementById("sound1") },
      { btn: document.getElementById("btn2"), sound: document.getElementById("sound2") }
    ];

    function stopAll() {
      buttons.forEach(({ sound }) => { sound.pause(); sound.currentTime = 0; });
    }

    function playBgm() {
      bgm.play().catch(() => {});
    }

    // ===== áãÇ ÇáÊÇÑÌíÊ íÊÚÑÝ =====
    target.addEventListener("targetFound", () => {
      scanner.style.display = "none";
      btnBar.classList.add("show");
      playBgm();
    });

    // ===== áãÇ ÇáÊÇÑÌíÊ íÎÊÝí =====
    target.addEventListener("targetLost", () => {
      scanner.style.display = "block";
      btnBar.classList.remove("show");
      stopAll();
      bgm.pause();
    });

    // Ãæá áãÓÉ ÊÝÊÍ ÊÕÑíÍ ÇáÕæÊ
    document.addEventListener("pointerdown", () => {
      if (!bgm.paused) return;
      bgm.play().then(() => {
        if (!btnBar.classList.contains("show")) bgm.pause();
      }).catch(() => {});
    }, { once: true });

    // ßá ÒÑÇÑ: íæÞÝ ÇáÊÇäí æíÔÛøá ÕæÊå
    buttons.forEach(({ btn, sound }) => {
      btn.addEventListener("click", () => {
        const wasPlaying = !sound.paused;
        stopAll();
        if (!wasPlaying) sound.play();
      });
    });
  </script>
</body>
</html>
